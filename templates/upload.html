{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>주간 다중 이미지 업로드</h2>
  <p>예시: 주차 키는 <strong>2026-W08</strong> 형식으로 입력하고, 이미지 10장까지 한 번에 올리세요.</p>
  <form method="post" enctype="multipart/form-data" class="grid-form">
    <label>주차 키 <input name="week_key" required></label>
    <label>이미지 파일들 (복수 선택 가능)
      <input type="file" name="images" accept="image/*" multiple required>
    </label>
    <button type="submit">OCR 처리 시작</button>
  </form>
</section>
{% endblock %}
